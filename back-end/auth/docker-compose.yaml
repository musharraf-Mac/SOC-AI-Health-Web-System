
services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network
    # restart: unless-stopped

networks:
  app-network:
    driver: bridge