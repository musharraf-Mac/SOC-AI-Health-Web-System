spring:
  application:
    name: doc_booking
  mongodb:
    uri: ${MONGODB_URI}
    database: ${DATABASE:soc_health_db}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8082}
logging:
  level:
    org.mongodb.driver: WARN
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
api:
  key: ${API_KEY}

booking:
  time-zone: ${BOOKING_TIME_ZONE:Asia/Colombo}
