spring:
  application:
    name: doc_booking
  mongodb:
    uri: ${MONGODB_URI}
    database: soc_health_db
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8082
logging:
  level:
    org.mongodb.driver: DEBUG
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
