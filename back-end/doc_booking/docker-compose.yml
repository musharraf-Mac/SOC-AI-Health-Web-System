
services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge