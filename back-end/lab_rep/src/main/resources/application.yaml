spring:
  application:
    name: lab_rep
  data:
    mongodb:
      uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8083}

reports:
  tasks:
    # Local diagnosis runs inside this backend, never in a remote Cloud Tasks worker.
    queue: ""
    # queue: ${REPORT_TASKS_QUEUE:}
    service-url: ${REPORT_SERVICE_URL:}
    service-account: ${REPORT_TASKS_SERVICE_ACCOUNT:}
  storage:
    bucket: ${GCS_BUCKET:}
ai:
  # Cloud providers are disabled in code on ft/lab-ollama, even with an old .env.
  provider-order: ollama
  ollama:
    # Always attempted on this branch; OLLAMA_ENABLED is intentionally ignored.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3.5:4b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
#   gemini:
#     api-key: ${GEMINI_API_KEY:}
#     model: ${GEMINI_MODEL:gemini-2.5-flash}
#   groq:
#     api-key: ${GROQ_API_KEY:}
#     model: ${GROQ_MODEL:openai/gpt-oss-120b}
#   openrouter:
#     api-key: ${OPENROUTER_API_KEY:}
#     model: ${OPENROUTER_MODEL:google/gemma-4-31b-it:free}

ocr:
  tessdata:
    path: ${TESSDATA_PATH:/opt/homebrew/share/tessdata}

api:
  key: ${API_KEY}

