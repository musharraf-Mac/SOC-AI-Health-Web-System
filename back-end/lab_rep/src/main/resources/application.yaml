spring:
  application:
    name: lab_rep
  data:
    mongodb:
      uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8083}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash

ocr:
  tessdata:
    path: ${TESSDATA_PATH:/opt/homebrew/share/tessdata}

storage:
  upload-dir: ./uploads
