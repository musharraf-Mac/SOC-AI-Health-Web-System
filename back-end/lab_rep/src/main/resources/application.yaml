spring:
  application:
    name: lab_rep
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://<user>:<password>@<cluster>.mongodb.net/healthdb}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8085

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:your-api-key-here}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-6

ocr:
  tessdata:
    path: ${TESSDATA_PATH:/opt/homebrew/share/tessdata}

storage:
  upload-dir: ./uploads