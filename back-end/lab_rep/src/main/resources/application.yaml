spring:
  application:
    name: lab_rep
  data:
    mongodb:
      uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8085}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-flash-latest

ocr:
  tessdata:
    path: ${TESSDATA_PATH:/opt/homebrew/share/tessdata}

api:
  key: ${API_KEY}

