spring:
  application:
    name: lab_rep
  data:
    mongodb:
      uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8083}

reports:
  tasks:
    # Local diagnosis runs inside this backend, never in a remote Cloud Tasks worker.
    queue: ""
    # queue: ${REPORT_TASKS_QUEUE:}
    service-url: ${REPORT_SERVICE_URL:}
    service-account: ${REPORT_TASKS_SERVICE_ACCOUNT:}
  storage:
    bucket: ${GCS_BUCKET:}
ai:
  provider-order: ${AI_PROVIDER_ORDER:ollama,groq1,openrouter,groq2}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3.5:4b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
  groq1:
    api-key: ${GROQ1_API_KEY:${GROQ_API_KEY:}}
    model: ${GROQ1_MODEL:openai/gpt-oss-120b}
    timeout-seconds: ${GROQ1_TIMEOUT_SECONDS:45}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemma-4-31b-it:free}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:45}
  groq2:
    api-key: ${GROQ2_API_KEY:${GROQ_API_KEY:}}
    model: ${GROQ2_MODEL:qwen/qwen3.8-27b}
    timeout-seconds: ${GROQ2_TIMEOUT_SECONDS:45}

ocr:
  tessdata:
    path: ${TESSDATA_PATH:/opt/homebrew/share/tessdata}

api:
  key: ${API_KEY}

