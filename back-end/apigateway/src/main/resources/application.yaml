spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: doc_booking
              uri: http://booking-service:8082
              predicates:
                - Path=/api/doc_booking/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: lab_rep
              uri: http://lab-report-service:8083
              predicates:
                - Path=/api/reports/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: bmi
              uri: http://bmi-service:8084
              predicates:
                - Path=/api/bmi/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: doctor
              uri: http://doctor-service:8086
              predicates:
                - Path=/api/doctor/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
              
           

  data:
    redis:
      host: localhost
      port: 6379
server:
  port: ${PORT}

jwt:
  secret: ${JWT_SECRET}