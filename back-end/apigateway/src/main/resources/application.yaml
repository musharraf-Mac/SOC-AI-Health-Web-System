spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: doc_booking
              uri: ${APPOINTMENT_SERVICE:http://localhost:8082}
              predicates:
                - Path=/api/doc_booking/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: lab_rep
              uri: ${LAB_REPORT_SERVICE:http://localhost:8083}
              predicates:
                - Path=/api/reports/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: bmi
              uri: ${BMI_SERVICE:http://localhost:8084}
              predicates:
                - Path=/api/bmi/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
            - id: doctor
              uri: ${DOCTOR_SERVICE:http://localhost:8086}
              predicates:
                - Path=/api/doctor/**
              filters:
                - AddRequestHeader=X-API-KEY, ${API_KEY}
              
           

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
server:
  port: ${PORT}

jwt:
  secret: ${JWT_SECRET}