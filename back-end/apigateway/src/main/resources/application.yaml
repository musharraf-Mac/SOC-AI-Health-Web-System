spring:
  application:
    name: apigateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: doc_booking
              uri: http://localhost:8082
              predicates:
                - Path=/api/doc_booking/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
           # Add more services here as teammates finish them:
             # - id: prescription-service
            #   uri: http://localhost:8083
           #   predicates:
            #     - Path=/api/prescriptions/**

  data:
    redis:
      host: localhost
      port: 6379
server:
  port: ${PORT}

jwt:
  secret: ${JWT_SECRET}