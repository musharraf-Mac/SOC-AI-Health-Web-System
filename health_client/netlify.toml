# Netlify configuration for Next.js App Router

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# Handle trailing slashes for consistency
[[redirects]]
  from = "/*.html"
  to = "/:splat/index.html"
  status = 200

# Copy Next.js output folder if it exists, otherwise use default publish directory
[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 200
